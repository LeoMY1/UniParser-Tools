[project]
name = "uniparser-agent"
version = "0.1.0"
description = "Chemistry document library workflow: parse, validate, dedupe, and store molecules and reactions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2023.9.1",
    "requests>=2.32.0",
    "typer>=0.12.0",
]

[project.scripts]
uniparser-agent = "uniparser_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uniparser_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
