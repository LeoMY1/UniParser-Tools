[project]
name = "uniparser-agent"
version = "0.1.0"
description = "UniParser agent: CN chemistry patents, exam VQA, and PDF translation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pillow>=10.4.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "requests>=2.32.0",
    "tiktoken>=0.7.0,<1",
    "typer>=0.12.0",
    "uniparser-tools",
    "xlsxwriter>=3.2.0",
]

[tool.uv.sources]
uniparser-tools = { path = "../", editable = true }

[project.scripts]
uniparser-agent = "uniparser_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"uniparser_agent" = "."

[tool.setuptools]
packages = [
    "uniparser_agent",
    "uniparser_agent.parse",
    "uniparser_agent.chemistry",
    "uniparser_agent.pdf2vqa",
    "uniparser_agent.pdf2translate",
    "uniparser_agent.llm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
